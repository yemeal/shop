services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: shop-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_FILE=/app/data/shop.db
      - KEYS_DIR=/app/data/keys
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:3000,http://127.0.0.1:5173}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
      - '443:443'
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:80/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - shop-network

volumes:
  backend-data:
    name: shop-backend-data

networks:
  shop-network:
    name: shop-network
    driver: bridge
